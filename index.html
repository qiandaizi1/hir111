<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PBR 贴图生成器（HDRI + 实时3D预览）</title>
  <style>
    :root{ --bg:#111; --card:#1b1b1b; --muted:#a9a9a9; --line:#2a2a2a; --warn:#ffcc66; --err:#ff6b6b; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:#eee; margin:0; padding:18px; }
    h1 { font-size:20px; margin:0 0 14px 0; }
    .panel { display:grid; grid-template-columns: 360px 1fr; gap:16px; align-items:start; }
    .controls, .preview { background:var(--card); padding:14px; border-radius:14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .controls label { display:block; margin-top:10px; font-size:13px; color:#ddd; }
    .controls small{ display:block; color:var(--muted); margin-top:6px; line-height:1.35; }
    .controls input[type=range], .controls select { width:100%; }
    .controls input[type=checkbox] { margin-right:8px; transform: translateY(1px); }
    .controls .group{ border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
    .controls .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .controls select{
      background:#101010; border:1px solid #333; color:#eee; padding:8px 10px; border-radius:10px; outline:none;
    }
    .controls button { margin-top:10px; padding:9px 12px; border-radius:10px; border:none; cursor:pointer; background:#2d7cff; color:white; font-weight:600; }
    .controls button.secondary{ background:#2a2a2a; color:#eee; }
    .controls button:active{ transform: translateY(1px); }

    .preview h3{ margin:0 0 8px 0; font-size:14px; color:#fff; }
    #viewerWrap{ position:relative; }
    #viewer{ width:100%; height:460px; border-radius:14px; overflow:hidden; background:#0b0b0b; border:1px solid #2b2b2b; }
    #errBox{
      position:absolute; inset:10px 10px auto 10px;
      display:none;
      padding:10px 12px;
      border-radius:12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,107,107,0.6);
      color:#fff;
      font-size:12px;
      white-space:pre-wrap;
      line-height:1.35;
    }
    #warnBox{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,204,102,0.35);
      color:#f3f3f3;
      font-size:12px;
      white-space:pre-wrap;
      line-height:1.35;
    }

    .maps{ margin-top:12px; display:flex; flex-wrap:wrap; gap:10px; }
    .mapCard{ width:240px; }
    .mapCard .title{ font-size:12px; color:#ddd; margin:2px 0 6px 2px; }
    canvas { width:240px; height:240px; background:#000; border-radius:10px; border:1px solid #2b2b2b; }

    details{ margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
    details summary{ cursor:pointer; color:#cfe2ff; }

    textarea.template{
      width:100%;
      min-height:280px;
      background:#0e0e0e;
      border:1px solid #2b2b2b;
      border-radius:10px;
      padding:10px;
      color:#d7d7d7;
      resize:vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height:1.35;
      white-space:pre;
      box-sizing:border-box;
    }

    @media (max-width: 980px){
      .panel{ grid-template-columns: 1fr; }
      .mapCard{ width:calc(50% - 10px); }
      canvas{ width:100%; height:auto; aspect-ratio:1/1; }
      #viewer{ height:420px; }
    }
  </style>

  <!-- Import Map：让 addons 内部的 `import "three"` 在纯 HTML 中可用 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
      }
    }
  </script>

<h1>🧱 PBR 贴图生成器（实时 3D 预览：HDRI / 形体 / 参数联动）</h1>

<div class="panel">
  <div class="controls">
    <label>上传 Base Color（基础颜色）</label>
    <input type="file" id="upload" accept="image/*" />
    <small>拖动滑杆三维视图立刻变化：关键滑杆/勾选都会自动触发更新（无需再点“生成/刷新”）。</small>

    <div class="group">
      <label>贴图分辨率（输出 / 下载清晰度）</label>
      <select id="outSize">
        <option value="512">512 × 512（快）</option>
        <option value="1024" selected>1024 × 1024（推荐）</option>
        <option value="2048">2048 × 2048（清晰）</option>
        <option value="4096">4096 × 4096（很清晰/较慢）</option>
      </select>

      <label><input type="checkbox" id="tileable" /> 生成无缝贴图（快速版：Offset + 接缝带模糊混合）</label>

      <label><input type="checkbox" id="genBase" checked /> Base Color</label>
      <label><input type="checkbox" id="genNormal" checked /> Normal</label>
      <label><input type="checkbox" id="genHeight" checked /> Height（用于位移/凹凸）</label>
      <label><input type="checkbox" id="genRough" checked /> Roughness</label>
      <label><input type="checkbox" id="genMetal" checked /> Metallic</label>
      <label><input type="checkbox" id="genAO" checked /> AO</label>
    </div>

    <div class="group">
      <label>预览形体</label>
      <select id="shape">
        <option value="sphere">圆球 Sphere</option>
        <option value="box">正方体 Box</option>
        <option value="cylinder">圆柱 Cylinder</option>
        <option value="plane">平面 Plane（支持真位移）</option>
      </select>

      <label><input type="checkbox" id="directXNormal" /> DirectX 法线（Flip Green / 反转Y）</label>

      <label>HDRI 环境（内置：切换即自动加载）</label>
      <select id="hdri">
        <optgroup label="影棚 / Studio">
          <option value="https://threejs.org/examples/textures/equirectangular/spot1Lux.hdr" selected>Spot1Lux（影棚灯）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/lobe.hdr">Lobe（影棚）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/memorial.hdr">Memorial（室内/展馆）</option>
        </optgroup>
        <optgroup label="室外 / Outdoor">
          <option value="https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr">Royal Esplanade（户外）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr">Venice Sunset（夕阳）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/quarry_01_1k.hdr">Quarry 01（采石场）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/spruit_sunrise_1k.hdr">Spruit Sunrise（清晨）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/blouberg_sunrise_2_1k.hdr">Blouberg Sunrise（晴天）</option>
        </optgroup>
        <optgroup label="城市/建筑 / Urban">
          <option value="https://threejs.org/examples/textures/equirectangular/pedestrian_overpass_1k.hdr">Pedestrian Overpass（城市）</option>
          <option value="https://threejs.org/examples/textures/equirectangular/san_giuseppe_bridge_2k.hdr">San Giuseppe Bridge（桥梁）</option>
        </optgroup>
      </select>

      <label><input type="checkbox" id="showEnvBg" /> 将 HDRI 作为背景显示（默认只做光照）</label>

      <label>曝光 Exposure（实时）</label>
      <input type="range" id="exposure" min="0.2" max="2.5" step="0.01" value="1.0" />

      <label><input type="checkbox" id="autoRotate" checked /> 自动旋转</label>
    </div>

    <div class="group">
      <label>亮度（Base Color）</label>
      <input type="range" id="brightness" min="0.5" max="1.5" step="0.01" value="1" />

      <label>法线强度（Normal Strength）</label>
      <input type="range" id="normalStrength" min="0" max="5" step="0.1" value="1" />

      <label>Height 强度（生成 Height 的对比/深浅）</label>
      <input type="range" id="heightStrength" min="0" max="5" step="0.1" value="1" />

      <label>位移强度（Displacement：实时，仅 Plane 启用）</label>
      <input type="range" id="dispScale" min="0" max="0.35" step="0.005" value="0.06" />

      <label>凹凸强度（Bump：实时）</label>
      <input type="range" id="bumpScale" min="0" max="2" step="0.05" value="0.7" />

      <label>粗糙度（Roughness：实时）</label>
      <input type="range" id="roughStrength" min="0" max="1" step="0.01" value="0.6" />

      <label>金属度（Metallic：实时）</label>
      <input type="range" id="metalStrength" min="0" max="1" step="0.01" value="0" />

      <label>AO 强度（实时）</label>
      <input type="range" id="aoStrength" min="0" max="2" step="0.05" value="1" />

      <div class="row2">
        <button id="btnGen" type="button">生成 / 刷新</button>
        <button class="secondary" id="btnDlSel" type="button">下载已勾选</button>
      </div>
      <button class="secondary" id="btnDlAll" type="button">下载全部贴图</button>

      <small>说明：滑杆/勾选会自动更新。球体“裂口”已修：法线边缘环绕采样 + 预览纹理禁用 mipmaps。</small>
    </div>

    <details>
      <summary>📦 Electron 桌面版模板（最小可运行）</summary>
      <small>要离线内置 HDRI：把 .hdr 文件放到本地（比如 ./hdri/xxx.hdr），把下拉框链接改成本地相对路径即可。</small>

    <div id="warnBox"></div>
  </div>

  <div class="preview">
    <h3>🎥 实时 3D 预览（HDRI IBL + 形体切换）</h3>
    <div id="viewerWrap">
      <div id="viewer"></div>
      <div id="errBox"></div>
    </div>

    <div class="maps">
      <div class="mapCard"><div class="title">BaseColor</div><canvas id="cBase" width="1024" height="1024"></canvas></div>
      <div class="mapCard"><div class="title">Normal</div><canvas id="cNormal" width="1024" height="1024"></canvas></div>
      <div class="mapCard"><div class="title">Height</div><canvas id="cHeight" width="1024" height="1024"></canvas></div>
      <div class="mapCard"><div class="title">Roughness</div><canvas id="cRough" width="1024" height="1024"></canvas></div>
      <div class="mapCard"><div class="title">Metallic</div><canvas id="cMetal" width="1024" height="1024"></canvas></div>
      <div class="mapCard"><div class="title">AO</div><canvas id="cAO" width="1024" height="1024"></canvas></div>
    </div>
  </div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

  const errBox = document.getElementById('errBox');
  const warnBox = document.getElementById('warnBox');

  function showErr(msg){
    errBox.style.display = 'block';
    errBox.textContent = String(msg || 'Unknown error');
  }

  // 让黑屏也能看到原因
  window.addEventListener('error', (e) => {
    try { showErr(`JS Error: ${e.message}\n${e.filename || ''}:${e.lineno || ''}:${e.colno || ''}`); } catch {}
  });
  window.addEventListener('unhandledrejection', (e) => {
    try { showErr(`Unhandled Promise Rejection: ${e.reason}`); } catch {}
  });

  // ====== 图片上传 ======
  let img = new Image();
  const upload = document.getElementById('upload');
  upload.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { img.src = ev.target.result; };
    reader.readAsDataURL(file);
  };

  const ui = {
    outSize: document.getElementById('outSize'),
    tileable: document.getElementById('tileable'),

    genBase: document.getElementById('genBase'),
    genNormal: document.getElementById('genNormal'),
    genHeight: document.getElementById('genHeight'),
    genRough: document.getElementById('genRough'),
    genMetal: document.getElementById('genMetal'),
    genAO: document.getElementById('genAO'),

    shape: document.getElementById('shape'),
    directXNormal: document.getElementById('directXNormal'),
    hdri: document.getElementById('hdri'),
    showEnvBg: document.getElementById('showEnvBg'),
    exposure: document.getElementById('exposure'),
    autoRotate: document.getElementById('autoRotate'),

    brightness: document.getElementById('brightness'),
    normalStrength: document.getElementById('normalStrength'),
    heightStrength: document.getElementById('heightStrength'),
    dispScale: document.getElementById('dispScale'),
    bumpScale: document.getElementById('bumpScale'),
    roughStrength: document.getElementById('roughStrength'),
    metalStrength: document.getElementById('metalStrength'),
    aoStrength: document.getElementById('aoStrength'),

    btnGen: document.getElementById('btnGen'),
    btnDlAll: document.getElementById('btnDlAll'),
    btnDlSel: document.getElementById('btnDlSel'),
  };

  let SIZE = parseInt(ui.outSize.value, 10) || 1024;

  const canvases = {
    base: document.getElementById('cBase'),
    normal: document.getElementById('cNormal'),
    height: document.getElementById('cHeight'),
    rough: document.getElementById('cRough'),
    metal: document.getElementById('cMetal'),
    ao: document.getElementById('cAO'),
  };

  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });

  function clamp255(v){ return Math.max(0, Math.min(255, v)); }
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  function clearAllCanvases(){
    Object.values(canvases).forEach(c=>c.getContext('2d').clearRect(0,0,SIZE,SIZE));
  }

  let regenTimer = 0;
  function scheduleGenerate(ms=80){
    if (!img.src) return;
    window.clearTimeout(regenTimer);
    regenTimer = window.setTimeout(()=>generate(), ms);
  }

  function setWarn(){
    warnBox.textContent =
      `当前贴图分辨率：${SIZE}×${SIZE}（越高越清晰，但生成/3D 更新更慢）。\n` +
      `已修复球体“裂口”：法线边缘环绕采样 + 预览纹理禁用 mipmaps。\n` +
      `提示：4K 可能较慢，少数设备 WebGL 最大纹理尺寸不足会报错。`;
  }

  function applySize(newSize){
    SIZE = Math.max(64, Math.min(8192, newSize|0));

    // 重设工作画布
    work.width = work.height = SIZE;

    // 重设输出画布像素分辨率（展示尺寸不变）
    Object.values(canvases).forEach(c => {
      c.width = SIZE;
      c.height = SIZE;
      c.getContext('2d').clearRect(0,0,SIZE,SIZE);
    });

    setWarn();
    scheduleGenerate(0);
  }

  // ====== 无缝（快速） ======
  function offsetWrap(src, w, h, ox, oy){
    const out = new ImageData(w, h);
    const s = src.data, d = out.data;
    for (let y=0;y<h;y++){
      const sy = (y + oy) % h;
      for (let x=0;x<w;x++){
        const sx = (x + ox) % w;
        const si = (sy*w + sx) * 4;
        const di = (y*w + x) * 4;
        d[di]   = s[si];
        d[di+1] = s[si+1];
        d[di+2] = s[si+2];
        d[di+3] = s[si+3];
      }
    }
    return out;
  }

  function boxBlurRGBA(imgData, w, h, radius){
    const src = imgData.data;
    const tmp = new Uint8ClampedArray(src.length);
    const dst = new Uint8ClampedArray(src.length);
    const r = Math.max(1, radius|0);

    for (let y=0;y<h;y++){
      let rsum=0, gsum=0, bsum=0, asum=0;
      for (let x=-r;x<=r;x++){
        const xx = Math.max(0, Math.min(w-1, x));
        const i = (y*w + xx)*4;
        rsum += src[i]; gsum += src[i+1]; bsum += src[i+2]; asum += src[i+3];
      }
      for (let x=0;x<w;x++){
        const i = (y*w + x)*4;
        tmp[i]   = rsum / (2*r+1);
        tmp[i+1] = gsum / (2*r+1);
        tmp[i+2] = bsum / (2*r+1);
        tmp[i+3] = asum / (2*r+1);

        const x1 = Math.max(0, x - r);
        const x2 = Math.min(w-1, x + r + 1);
        const i1 = (y*w + x1)*4;
        const i2 = (y*w + x2)*4;
        rsum += src[i2]   - src[i1];
        gsum += src[i2+1] - src[i1+1];
        bsum += src[i2+2] - src[i1+2];
        asum += src[i2+3] - src[i1+3];
      }
    }

    for (let x=0;x<w;x++){
      let rsum=0, gsum=0, bsum=0, asum=0;
      for (let y=-r;y<=r;y++){
        const yy = Math.max(0, Math.min(h-1, y));
        const i = (yy*w + x)*4;
        rsum += tmp[i]; gsum += tmp[i+1]; bsum += tmp[i+2]; asum += tmp[i+3];
      }
      for (let y=0;y<h;y++){
        const i = (y*w + x)*4;
        dst[i]   = rsum / (2*r+1);
        dst[i+1] = gsum / (2*r+1);
        dst[i+2] = bsum / (2*r+1);
        dst[i+3] = asum / (2*r+1);

        const y1 = Math.max(0, y - r);
        const y2 = Math.min(h-1, y + r + 1);
        const i1 = (y1*w + x)*4;
        const i2 = (y2*w + x)*4;
        rsum += tmp[i2]   - tmp[i1];
        gsum += tmp[i2+1] - tmp[i1+1];
        bsum += tmp[i2+2] - tmp[i1+2];
        asum += tmp[i2+3] - tmp[i1+3];
      }
    }

    const out = new ImageData(w, h);
    out.data.set(dst);
    return out;
  }

  function makeTileableFast(imgData, w, h){
    const halfX = (w/2)|0;
    const halfY = (h/2)|0;
    const band = Math.max(12, Math.floor(Math.min(w,h) * 0.06));

    const shifted = offsetWrap(imgData, w, h, halfX, halfY);
    const blurred = boxBlurRGBA(shifted, w, h, 6);

    const out = new ImageData(w, h);
    const s = shifted.data, b = blurred.data, d = out.data;

    const cx = halfX, cy = halfY;
    for (let y=0;y<h;y++){
      const dy = Math.abs(y - cy);
      const wy = 1 - clamp01(dy / band);
      for (let x=0;x<w;x++){
        const dx = Math.abs(x - cx);
        const wx = 1 - clamp01(dx / band);
        const wgt = Math.max(wx, wy);
        const i = (y*w + x)*4;
        d[i]   = clamp255(s[i]   * (1-wgt) + b[i]   * wgt);
        d[i+1] = clamp255(s[i+1] * (1-wgt) + b[i+1] * wgt);
        d[i+2] = clamp255(s[i+2] * (1-wgt) + b[i+2] * wgt);
        d[i+3] = 255;
      }
    }
    return out;
  }

  function ensureWorkBase(){
    wctx.clearRect(0,0,SIZE,SIZE);
    wctx.drawImage(img, 0,0,SIZE,SIZE);

    let d = wctx.getImageData(0,0,SIZE,SIZE);

    const bright = +ui.brightness.value;
    for (let i=0;i<d.data.length;i+=4){
      d.data[i]   = clamp255(d.data[i]   * bright);
      d.data[i+1] = clamp255(d.data[i+1] * bright);
      d.data[i+2] = clamp255(d.data[i+2] * bright);
    }

    if (ui.tileable.checked) d = makeTileableFast(d, SIZE, SIZE);
    wctx.putImageData(d,0,0);
  }

  function drawBase(){
    canvases.base.getContext('2d').drawImage(work,0,0);
  }

  function drawHeight(){
    const ctx = canvases.height.getContext('2d');
    const src = wctx.getImageData(0,0,SIZE,SIZE);
    const out = ctx.createImageData(SIZE,SIZE);

    const s = +ui.heightStrength.value;
    const gamma = Math.max(0.15, 1.0 / (0.6 + s*0.35));

    for (let i=0;i<src.data.length;i+=4){
      const v = (src.data[i] + src.data[i+1] + src.data[i+2]) / 3 / 255;
      const h = Math.pow(v, gamma) * 255;
      out.data[i] = out.data[i+1] = out.data[i+2] = clamp255(h);
      out.data[i+3] = 255;
    }
    ctx.putImageData(out,0,0);
  }

  // ✅ 修复球体“裂口”：边缘采样采用环绕（tileable=on）或 clamp（off），不再出现边缘法线为0导致黑口子
  function computeNormalFromGray(srcData, w, h, tileable, nStrength, hStrength){
    const out = new ImageData(w, h);

    function grayAt(x, y){
      if (tileable){
        x = (x % w + w) % w;
        y = (y % h + h) % h;
      } else {
        x = Math.max(0, Math.min(w-1, x));
        y = Math.max(0, Math.min(h-1, y));
      }
      const i = (y*w + x)*4;
      return (srcData[i] + srcData[i+1] + srcData[i+2]) / 3;
    }

    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        const i = (y*w + x) * 4;

        const hL = grayAt(x-1, y);
        const hR = grayAt(x+1, y);
        const hU = grayAt(x, y-1);
        const hD = grayAt(x, y+1);

        let dx = (hR - hL)/255 * hStrength;
        let dy = (hD - hU)/255 * hStrength;

        let nx = dx * nStrength;
        let ny = dy * nStrength;
        let nz = 1.0;

        const len = Math.sqrt(nx*nx+ny*ny+nz*nz) || 1;
        nx/=len; ny/=len; nz/=len;

        out.data[i]   = clamp255((nx*0.5+0.5)*255);
        out.data[i+1] = clamp255((ny*0.5+0.5)*255);
        out.data[i+2] = clamp255((nz*0.5+0.5)*255);
        out.data[i+3] = 255;
      }
    }
    return out;
  }

  function drawNormal(){
    const ctx = canvases.normal.getContext('2d');
    const src = wctx.getImageData(0,0,SIZE,SIZE);
    const out = computeNormalFromGray(
      src.data, SIZE, SIZE,
      ui.tileable.checked,
      +ui.normalStrength.value,
      +ui.heightStrength.value
    );
    ctx.putImageData(out,0,0);
  }

  function drawRough(){
    const ctx = canvases.rough.getContext('2d');
    const g = clamp255(clamp01(+ui.roughStrength.value) * 255);
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.fillRect(0,0,SIZE,SIZE);
  }

  function drawMetal(){
    const ctx = canvases.metal.getContext('2d');
    const g = clamp255(clamp01(+ui.metalStrength.value) * 255);
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.fillRect(0,0,SIZE,SIZE);
  }

  function drawAO(){
    const ctx = canvases.ao.getContext('2d');
    const src = wctx.getImageData(0,0,SIZE,SIZE);
    const out = ctx.createImageData(SIZE,SIZE);
    const strength = +ui.aoStrength.value;
    for (let i=0;i<src.data.length;i+=4){
      const v = (src.data[i]+src.data[i+1]+src.data[i+2]) / 3;
      const ao = Math.pow(v/255, strength) * 255;
      out.data[i] = out.data[i+1] = out.data[i+2] = clamp255(ao);
      out.data[i+3] = 255;
    }
    ctx.putImageData(out,0,0);
  }

  function generate(){
    if (!img.src) return;
    clearAllCanvases();
    ensureWorkBase();

    if (ui.genBase.checked) drawBase();
    if (ui.genHeight.checked) drawHeight();
    if (ui.genNormal.checked) drawNormal();
    if (ui.genRough.checked) drawRough();
    if (ui.genMetal.checked) drawMetal();
    if (ui.genAO.checked) drawAO();

    updatePBRPreview(true);
  }

  function downloadCanvas(canvas, filename){
    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  function downloadSelected(){
    if (ui.genBase.checked) downloadCanvas(canvases.base, 'BaseColor.png');
    if (ui.genNormal.checked) downloadCanvas(canvases.normal, 'Normal.png');
    if (ui.genHeight.checked) downloadCanvas(canvases.height, 'Height.png');
    if (ui.genRough.checked) downloadCanvas(canvases.rough, 'Roughness.png');
    if (ui.genMetal.checked) downloadCanvas(canvases.metal, 'Metallic.png');
    if (ui.genAO.checked) downloadCanvas(canvases.ao, 'AO.png');
  }

  function downloadAll(){
    downloadCanvas(canvases.base, 'BaseColor.png');
    downloadCanvas(canvases.normal, 'Normal.png');
    downloadCanvas(canvases.height, 'Height.png');
    downloadCanvas(canvases.rough, 'Roughness.png');
    downloadCanvas(canvases.metal, 'Metallic.png');
    downloadCanvas(canvases.ao, 'AO.png');
  }

  ui.btnGen.addEventListener('click', generate);
  ui.btnDlAll.addEventListener('click', downloadAll);
  ui.btnDlSel.addEventListener('click', downloadSelected);

  [
    ui.tileable,
    ui.genBase, ui.genNormal, ui.genHeight, ui.genRough, ui.genMetal, ui.genAO,
    ui.brightness, ui.normalStrength, ui.heightStrength,
    ui.roughStrength, ui.metalStrength, ui.aoStrength
  ].forEach(el => {
    el.addEventListener('input', () => scheduleGenerate(90));
    el.addEventListener('change', () => scheduleGenerate(90));
  });

  ui.outSize.addEventListener('change', () => applySize(parseInt(ui.outSize.value, 10)));
  ui.outSize.addEventListener('input',  () => applySize(parseInt(ui.outSize.value, 10)));

  // ====== Three.js 预览 ======
  const container = document.getElementById('viewer');

  // WebGL 检测
  try {
    const testCanvas = document.createElement('canvas');
    const gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
    if (!gl) showErr('WebGL 不可用：浏览器/环境禁用了 WebGL，所以 3D 预览会黑屏。\n请换 Chrome/Edge 或开启硬件加速。');
  } catch (e) {
    showErr('WebGL 检测失败：' + e);
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141414);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0.0, 0.1, 2.8);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = +ui.exposure.value;
  renderer.physicallyCorrectLights = true;
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2b2b2b, 0.35));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(3,3,3);
  scene.add(key);

  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0, metalness: 0.0 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1.25;
  scene.add(ground);

  const material = new THREE.MeshPhysicalMaterial({
    roughness: clamp01(+ui.roughStrength.value),
    metalness: clamp01(+ui.metalStrength.value),
    clearcoat: 0.0,
    clearcoatRoughness: 0.04,
  });

  let geometry = null;
  let mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), material);
  scene.add(mesh);

  let currentShape = 'sphere';

  function applyUV2(geo){
    if (geo.attributes.uv && !geo.attributes.uv2) geo.setAttribute('uv2', geo.attributes.uv.clone());
  }

  function setShape(type){
    currentShape = type;
    if (geometry) geometry.dispose();
    scene.remove(mesh);

    if (type === 'sphere') {
      geometry = new THREE.SphereGeometry(1, 128, 128);
      mesh = new THREE.Mesh(geometry, material);
      camera.position.set(0.0, 0.1, 2.8);
    } else if (type === 'box') {
      geometry = new THREE.BoxGeometry(1.6, 1.6, 1.6, 96, 96, 96);
      mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.set(0.2, 0.6, 0);
      camera.position.set(0.0, 0.15, 3.0);
    } else if (type === 'cylinder') {
      geometry = new THREE.CylinderGeometry(0.95, 0.95, 1.8, 160, 96, false);
      mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.set(0.15, 0.6, 0);
      camera.position.set(0.0, 0.12, 3.0);
    } else {
      geometry = new THREE.PlaneGeometry(2.2, 2.2, 320, 320);
      mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.set(-0.25, 0.65, 0);
      camera.position.set(0.0, 0.0, 2.7);
    }

    applyUV2(geometry);
    scene.add(mesh);
    controls.target.set(0,0,0);
    controls.update();
    updatePBRPreview(false);
  }

  ui.shape.addEventListener('change', () => setShape(ui.shape.value));

  const tex = { map:null, normal:null, rough:null, metal:null, ao:null, height:null };

  function disposeTex(t){ if (t) t.dispose(); }

  function canvasToTexture(canvas, isColor=false, tileable=false){
    const t = new THREE.CanvasTexture(canvas);

    // tileable：Repeat；否则 Clamp
    t.wrapS = t.wrapT = tileable ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;

    // ✅ 关键：禁用 mipmaps，避免接缝采样被放大成“裂口”
    t.generateMipmaps = false;
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;

    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    if (isColor) t.colorSpace = THREE.SRGBColorSpace;
    t.needsUpdate = true;
    return t;
  }

  function applyMaterialParams(){
    renderer.toneMappingExposure = +ui.exposure.value;
    material.roughness = clamp01(+ui.roughStrength.value);
    material.metalness = clamp01(+ui.metalStrength.value);
    material.aoMapIntensity = +ui.aoStrength.value;

    if (material.normalScale) material.normalScale.set(1, ui.directXNormal.checked ? -1 : 1);

    // 真位移默认只在 Plane 启用（box/cylinder 容易开裂）
    const allowDisplacement = (currentShape === 'plane');
    material.displacementScale = (ui.genHeight.checked && allowDisplacement) ? +ui.dispScale.value : 0;
    material.bumpScale = ui.genHeight.checked ? +ui.bumpScale.value : 0;

    material.needsUpdate = true;
  }

  ui.exposure.addEventListener('input', applyMaterialParams);
  ui.roughStrength.addEventListener('input', applyMaterialParams);
  ui.metalStrength.addEventListener('input', applyMaterialParams);
  ui.aoStrength.addEventListener('input', applyMaterialParams);
  ui.directXNormal.addEventListener('change', applyMaterialParams);
  ui.dispScale.addEventListener('input', applyMaterialParams);
  ui.bumpScale.addEventListener('input', applyMaterialParams);

  function updatePBRPreview(rebuildTextures){
    if (rebuildTextures) {
      if (ui.genBase.checked) {
        disposeTex(tex.map);
        tex.map = canvasToTexture(canvases.base, true, ui.tileable.checked);
        material.map = tex.map;
        material.color.set(0xffffff);
      } else {
        material.map = null;
        material.color.set(0xbfbfbf);
      }

      if (ui.genNormal.checked) {
        disposeTex(tex.normal);
        tex.normal = canvasToTexture(canvases.normal, false, ui.tileable.checked);
        material.normalMap = tex.normal;
      } else {
        material.normalMap = null;
      }

      if (ui.genRough.checked) {
        disposeTex(tex.rough);
        tex.rough = canvasToTexture(canvases.rough, false, ui.tileable.checked);
        material.roughnessMap = tex.rough;
      } else {
        material.roughnessMap = null;
      }

      if (ui.genMetal.checked) {
        disposeTex(tex.metal);
        tex.metal = canvasToTexture(canvases.metal, false, ui.tileable.checked);
        material.metalnessMap = tex.metal;
      } else {
        material.metalnessMap = null;
      }

      if (ui.genAO.checked) {
        disposeTex(tex.ao);
        tex.ao = canvasToTexture(canvases.ao, false, ui.tileable.checked);
        material.aoMap = tex.ao;
      } else {
        material.aoMap = null;
      }

      if (ui.genHeight.checked) {
        disposeTex(tex.height);
        tex.height = canvasToTexture(canvases.height, false, ui.tileable.checked);
        material.displacementMap = tex.height;
        material.bumpMap = tex.height;
      } else {
        material.displacementMap = null;
        material.bumpMap = null;
      }
    }

    applyMaterialParams();
  }

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const hdriCache = new Map();
  const MAX_HDRI_CACHE = 6;

  async function loadHDRI(url){
    if (!url) return;

    if (hdriCache.has(url)) {
      const cached = hdriCache.get(url);
      scene.environment = cached.envTex;
      scene.background = ui.showEnvBg.checked ? cached.bgTex : new THREE.Color(0x141414);
      return;
    }

    try {
      const hdr = await new RGBELoader().loadAsync(url);
      hdr.mapping = THREE.EquirectangularReflectionMapping;

      const envRT = pmrem.fromEquirectangular(hdr);
      const envTex = envRT.texture;
      const bgTex = envTex;

      hdr.dispose();

      if (hdriCache.size >= MAX_HDRI_CACHE) {
        const firstKey = hdriCache.keys().next().value;
        const first = hdriCache.get(firstKey);
        if (first?.envTex) first.envTex.dispose();
        hdriCache.delete(firstKey);
      }

      hdriCache.set(url, { envTex, bgTex });
      scene.environment = envTex;
      scene.background = ui.showEnvBg.checked ? bgTex : new THREE.Color(0x141414);

    } catch (err) {
      console.warn('HDRI 加载失败：', err);
      alert('HDRI 加载失败（可能跨域/链接不存在/文件太大）。\n请换一个 HDRI 选项。');
    }
  }

  ui.hdri.addEventListener('change', () => loadHDRI(ui.hdri.value));
  ui.showEnvBg.addEventListener('change', () => loadHDRI(ui.hdri.value));

  function resize(){
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  const ro = new ResizeObserver(() => resize());
  ro.observe(container);
  window.addEventListener('resize', resize);

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    if (ui.autoRotate.checked) mesh.rotation.y += 0.004;
    renderer.render(scene, camera);
  }
  animate();

  // ====== 初始化 ======
  applySize(parseInt(ui.outSize.value, 10));  // 先应用分辨率
  setShape(ui.shape.value);
  loadHDRI(ui.hdri.value);
  resize();
  img.onload = () => generate();

  // ====== 自检（测试用例） ======
  function runSelfTests(){
    console.assert(typeof THREE.Scene === 'function', 'SelfTest: THREE.Scene missing');
    console.assert(container instanceof HTMLElement, 'SelfTest: viewer container missing');
    console.assert(canvases.base.width === SIZE && canvases.base.height === SIZE, 'SelfTest: canvas size mismatch');
    console.assert(typeof generate === 'function', 'SelfTest: generate missing');
    console.assert(typeof loadHDRI === 'function', 'SelfTest: loadHDRI missing');
    console.assert(typeof makeTileableFast === 'function', 'SelfTest: makeTileableFast missing');

    // 法线边缘也必须正确（避免球体黑口子）
    const flat = new ImageData(16,16);
    for (let i=0;i<flat.data.length;i+=4){ flat.data[i]=128; flat.data[i+1]=128; flat.data[i+2]=128; flat.data[i+3]=255; }
    const nm = computeNormalFromGray(flat.data, 16, 16, true, 1, 1);
    console.assert(Math.abs(nm.data[0]-128) <= 2, 'SelfTest: normal R not ~128');
    console.assert(Math.abs(nm.data[1]-128) <= 2, 'SelfTest: normal G not ~128');
    console.assert(nm.data[2] >= 250, 'SelfTest: normal B not ~255');

    console.info('SelfTest: OK');
  }
  runSelfTests();

  window.__PBR = { THREE, scene, camera, renderer, material, setShape, loadHDRI, generate };
</script>

</body>
</html>
